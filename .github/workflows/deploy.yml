name: Deploy Express Subdomain to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type-check and Build
        run: npm run build

      - name: Verify Production Entry Point
        run: test -f dist/index.js

      - name: FTP Deploy to Hostinger Subdomain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git**
            **/.git/**
            **/.github/**
            **/node_modules/**
            src/**
            database/**
            docs/**
            tsconfig.json
            .env.example
            README.md
            postman_collection.json
            postman_environment.json
