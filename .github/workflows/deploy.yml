name: Validate Backend for Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type-check and Build
        run: npm run build

      - name: Verify Production Entry Point
        run: test -f dist/index.js

      # Deployment is handled by Hostinger's Node.js Web App GitHub integration.
      # FTP only copies files and cannot create or restart a Node.js process.
