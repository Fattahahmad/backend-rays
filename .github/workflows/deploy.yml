# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Deploy Express Subdomain to Hostinger

on:
  push:
    branches:
      - main # Otomatis jalan setiap push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js v20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install dependencies & Build TypeScript ke JavaScript
      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      # 4. Upload file hasil build ke Subdomain Hostinger via FTP
      - name: FTP Deploy to Hostinger Subdomain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Path target subdomain di Hostinger (sesuaikan nama folder subdomain kamu)
          server-dir: ./
          # Kecualikan file source code TypeScript & config development
          exclude: |
            **/.git**
            **/.git/**
            **/node_modules/**
            src/**
            tsconfig.json
            .env.example
            README.md
